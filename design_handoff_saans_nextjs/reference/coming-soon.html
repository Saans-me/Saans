<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&amp;display=swap" rel="stylesheet">
<title>saans · Coming soon</title>
<script src="./motion.js"></script>
<style>
:root{--bg:#F7F5FA;--surface:#FBFAFD;--text:#3B3355;--text2:#5E5675;--border:#E6E1EF;--primary:#5E5480;--on-primary:#F7F5FA;--accent:#B9B0D9;--soft1:#ECE8F4;--leaf1:#3B3355;--leaf2:#B9B0D9;--shadow:rgba(59,51,85,.14);color-scheme:light}
[data-theme="dark"]{--bg:#1C1828;--surface:#241F33;--text:#EEEAF6;--text2:#B9B1CF;--border:#352E48;--primary:#C9C0E6;--on-primary:#2A2440;--accent:#B9B0D9;--soft1:#2A2440;--leaf1:#EEEAF6;--leaf2:#B9B0D9;--shadow:rgba(10,8,18,.45);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Comfortaa',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s ease,color .4s ease}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:var(--primary);text-underline-offset:3px}
a:hover{color:var(--text)}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
html,body,*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
@keyframes cs-breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1)}}
@keyframes cs-spin{from{opacity:0;transform:rotate(-120deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes cs-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:'Comfortaa',system-ui,sans-serif;overflow:hidden">
  <header style="max-width:1240px;width:100%;margin:0 auto;padding:0 clamp(16px,3vw,32px);height:76px;display:flex;align-items:center;gap:16px">
    <a href="./" aria-label="saans home" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)">
      <svg width="30" height="33" viewBox="50 38 170 186" aria-hidden="true"><path d="M50 129V102C50 68 80 53 110 53H170V82C170 114 140 129 112 129Z" style="fill:var(--leaf1)"></path><path d="M70 224V197C70 163 100 148 130 148H190V177C190 209 160 224 132 224Z" style="fill:var(--leaf2)"></path><circle cx="204.5" cy="53.5" r="15" fill="#FF5E00"></circle></svg>
      <span style="font-weight:700;font-size:24px;letter-spacing:-0.03em">saans</span>
    </a>
    <button type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" style="margin-left:auto;width:46px;height:46px;border-radius:999px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer" style-hover="background:var(--soft1)">
      <svg key="{{ themeLabel }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation:cs-spin .6s cubic-bezier(.22,1,.36,1)"><path d="{{ themeIcon }}"></path></svg>
    </button>
  </header>
  <main style="flex:1;position:relative;display:grid;place-items:center;padding:clamp(24px,5vw,64px) clamp(20px,4vw,32px)">
    <div aria-hidden="true" style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none">{{ orb }}</div>
    <div style="position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px;max-width:640px;animation:cs-rise .8s cubic-bezier(.16,1,.3,1)">
      
      <span style="display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-weight: 700; font-size: 20px; letter-spacing: .14em; color: var(--text2); white-space: nowrap; flex: none">COMING SOON</span><h1 style="margin:0;font-weight:700;font-size:clamp(38px,6vw,68px);line-height:1.06;letter-spacing:-0.03em;text-wrap:balance">saans is almost ready to listen.</h1>
      <p style="margin:0;font-size:clamp(17px,1.5vw,19px);line-height:1.7;color:var(--text2);max-width:500px;text-wrap:pretty">We're taking our time to get this right. Conversations by voice and text open soon, private from day one.</p>
      <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding-top:4px">
        <a href="./" style="height:56px;padding:0 30px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:16px;text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:transform .35s cubic-bezier(.22,1,.36,1)" style-hover="transform:translateY(-2px);color:var(--on-primary)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6"></path></svg>Back to home</a>
      </div>
      
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: (() => { let t = 'light'; try { t = localStorage.getItem('saans-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {} document.documentElement.setAttribute('data-theme', t); return t; })() };
  toggleTheme = (e) => {
    const t = this.state.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('saans-theme', t); } catch (err) {}
    if (window.saansTheme) window.saansTheme(t, e); else document.documentElement.setAttribute('data-theme', t);
    this.setState({ theme: t });
  };
  renderVals() {
    const dark = this.state.theme === 'dark';
    return {
      toggleTheme: this.toggleTheme,
      themeLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
      themeIcon: dark ? 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' : 'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z',
      orb: React.createElement('div', { style: { width: 'min(720px, 130vw)', aspectRatio: '1', borderRadius: '50%', background: 'radial-gradient(circle, color-mix(in srgb, var(--primary) 26%, transparent) 0%, color-mix(in srgb, var(--accent) 28%, transparent) 34%, color-mix(in srgb, var(--accent) 10%, transparent) 54%, transparent 70%)', opacity: dark ? 0.7 : 1, animation: 'cs-breathe 8s ease-in-out infinite' } })
    };
  }
}
</script>
</body>
</html>
